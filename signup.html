<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Oak & Grain account.">
  <title>Create an account — Oak & Grain</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <header class="site-header auth-header">
    <a class="logo" href="index.html">OAK<span>&</span>GRAIN</a>
    <a class="auth-back" href="index.html">← Back to the studio</a>
  </header>

  <main class="auth-main">
    <section class="auth-panel" aria-labelledby="signup-title">
      <p class="section-label">YOUR PROJECT, IN ONE PLACE</p>
      <h1 id="signup-title">Make it<br><em>personal.</em></h1>
      <p class="auth-intro">Create an account to save ideas and keep track of every step of your commission.</p>
      <form class="auth-form" data-auth-form>
        <label for="signup-name">Your name</label>
        <input id="signup-name" name="name" type="text" autocomplete="name" required>
        <label for="signup-email">Email address</label>
        <input id="signup-email" name="email" type="email" autocomplete="email" required>
        <label for="signup-password">Create a password</label>
        <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <label class="check-label consent"><input type="checkbox" required> <span>I agree to receive project updates and accept the terms.</span></label>
        <button class="button button-dark" type="submit">Create account <span>→</span></button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in →</a></p>
    </section>
    <aside class="auth-image auth-image-signup" aria-label="Woodworking tools on a workbench"></aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
