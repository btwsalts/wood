<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your Oak & Grain account.">
  <title>Log in — Oak & Grain</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <header class="site-header auth-header">
    <a class="logo" href="index.html">OAK<span>&</span>GRAIN</a>
    <a class="auth-back" href="index.html">← Back to the studio</a>
  </header>

  <main class="auth-main">
    <section class="auth-panel" aria-labelledby="login-title">
      <p class="section-label">WELCOME BACK</p>
      <h1 id="login-title">Back to the<br><em>workshop.</em></h1>
      <p class="auth-intro">Log in to follow your commission, review project details, and keep in touch.</p>
      <form class="auth-form" data-auth-form>
        <label for="login-email">Email address</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <div class="form-row"><label class="check-label"><input type="checkbox" name="remember"> <span>Remember me</span></label><a href="#">Forgot password?</a></div>
        <button class="button button-dark" type="submit">Log in <span>→</span></button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="auth-switch">New to Oak &amp; Grain? <a href="signup.html">Create an account →</a></p>
    </section>
    <aside class="auth-image auth-image-login" aria-label="A handcrafted wood table in the workshop"></aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
